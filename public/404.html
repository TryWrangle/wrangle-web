<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA routing: store the full path in sessionStorage and
      // redirect to the root so index.html can restore it via the History API.
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.setItem('spa_redirect', path + search + hash);
      window.location.replace('/wrangle-web/');
    </script>
  </head>
  <body></body>
</html>
